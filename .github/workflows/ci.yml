name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela execuções antigas do mesmo branch quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Front-end · Typecheck · Lint · Testes · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Testes (unidade)
        # Sem banco neste job: as suítes de integração ficam de fora e rodam no
        # job `database`, onde o Supabase está no ar.
        run: npm run test -- --exclude '**/*.integration.test.ts'

      - name: Build
        run: npm run build

  database:
    name: Banco · Migrations · RLS · Máquina de estados
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Subir o Supabase local
        # Perfil APP: Postgres, Auth, API REST e Storage — tudo que as suítes de
        # integração exercitam. Continua sem Studio, logs e edge runtime.
        run: npx supabase start -x imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Preparar variáveis do Supabase local
        run: |
          npx supabase status -o env \
            | sed -e 's/^API_URL=/VITE_SUPABASE_URL=/' \
                  -e 's/^ANON_KEY=/VITE_SUPABASE_ANON_KEY=/' \
                  -e 's/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/' \
                  -e 's/"//g' \
            | grep -E '^(VITE_SUPABASE_URL|VITE_SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY)=' \
            >> "$GITHUB_ENV"

      - name: Testes de banco (pgTAP)
        # Isolamento por papel, máquina de estados e conflito de agenda.
        # É a prova de que nenhuma imobiliária enxerga a carteira da outra.
        #
        # ANTES da integração, e a ordem é obrigatória: estas asserções são do
        # tipo "a inquilina enxerga EXATAMENTE 1 chamado", medidas contra o seed.
        # As suítes de integração abrem chamados de verdade e mudariam a
        # contagem. O pgTAP roda dentro de transação com rollback, então não
        # deixa rastro para quem vem depois.
        run: npx supabase test db

      - name: Testes de integração
        # Ciclo de vida do chamado, fotos no Storage, realtime e autorização do
        # endpoint administrativo, contra o banco de verdade. Com CI=true a
        # suíte FALHA se o banco não responder, em vez de se pular em silêncio.
        #
        # O filtro é SUBSTRING de caminho, não glob: o `'**/*.integration.test.ts'`
        # que estava aqui não casava com nada e o passo morria em "No test files
        # found" — um job vermelho que parecia problema de banco.
        env:
          CI: 'true'
        run: npm run test -- integration.test

      - name: Verificar que as migrations refletem o schema
        # `db diff` vazio garante que ninguém alterou o banco pelo Studio sem
        # gerar a migration correspondente.
        run: |
          DIFF=$(npx supabase db diff)
          if [ -n "$DIFF" ]; then
            echo "::error::O schema diverge das migrations. Rode 'npm run db:diff' e gere a migration."
            echo "$DIFF"
            exit 1
          fi
          echo "Schema e migrations em sincronia."

      - name: Encerrar o Supabase
        # `always()` para não deixar container de pé quando um passo acima falha.
        # No runner efêmero do GitHub isso é higiene; na máquina de quem roda
        # localmente, é o que evita o banco ficar rodando por dias.
        if: always()
        run: npx supabase stop --no-backup
